# 复制为 smtp.toml 并填写。smtp.toml 含账号信息，不要提交到版本库或发给别人。
#
# 常见服务器：
#   QQ 邮箱     smtp.qq.com        465 ssl      (需在邮箱设置里开启 SMTP 并生成“授权码”)
#   163 邮箱    smtp.163.com       465 ssl      (同上，用授权码)
#   Gmail       smtp.gmail.com     465 ssl      (需应用专用密码)
#   企业微信    smtp.exmail.qq.com 465 ssl
#   Office 365  smtp.office365.com 587 starttls

[smtp]
host      = "smtp.example.com"
port      = 465
security  = "ssl"                  # ssl | starttls | none
username  = "you@example.com"
from_name = "赵采购"
# from_addr = "you@example.com"    # 省略则等于 username

# 密码不建议写在文件里。三选一：
#   1) 设置环境变量 MAILER_SMTP_PASSWORD（或用 password_env 指定别的变量名）
#   2) 什么都不配，发送时命令行会提示输入（输入不回显）
#   3) 直接写 password = "..."（最不安全）
# password_env = "MAILER_SMTP_PASSWORD"
